# Every push to main builds the site and redeploys Cloud Run.
# Authentication is keyless (Workload Identity Federation): no service-account key is stored in GitHub.
# The one-time Google Cloud setup is in docs/deploy-from-github.md.
# NOTE: a deploy restarts the service, and the hospital lives in memory — never push during judging.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT: hop-hacks-509103
  REGION: us-east4
  SERVICE: emerflow

permissions:
  contents: read
  id-token: write # needed to fetch the OIDC token Google checks

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site (static export FastAPI serves)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the classic frontend (DeepChart, patient links)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: projects/229667440524/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: emerflow-deployer@hop-hacks-509103.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --source . \
            --min-instances 1 --max-instances 1 --no-cpu-throttling \
            --timeout 3600 --memory 1Gi \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,GOOGLE_CLOUD_LOCATION=global,EMERFLOW_MODE=live,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,GEMINI_LITE_MODEL=gemini-3.1-pro-preview,EMERFLOW_DEMO_KEY=${{ secrets.EMERFLOW_DEMO_KEY || 'demo' }}" \
            --allow-unauthenticated

      - name: Show the URL
        run: gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format="value(status.url)"
